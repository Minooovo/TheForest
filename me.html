<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Forest · 我的资料</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
body{background:#f7f3ee;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px;}
.app-wrapper{max-width:560px;width:100%;background:#fff;border-radius:36px;box-shadow:0 20px 40px rgba(0,0,0,.08);padding:28px 24px 36px;}
.header{text-align:center;margin-bottom:22px;}
.header h1{font-size:1.6rem;color:#2e2a24;font-family:Georgia,serif;margin-bottom:4px;}
.header p{font-size:.88rem;color:#8a7663;}
.header .today{display:inline-block;margin-top:10px;background:#f1ebe4;color:#5e4b3a;padding:5px 14px;border-radius:30px;font-size:.8rem;font-weight:600;}
.photo-edit{width:180px;height:180px;margin:0 auto 16px;background:#e9e1d7;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;position:relative;border:1px solid #d9cbb9;box-shadow:0 0 0 6px #fcf9f6,0 0 0 7px #d9cbb9;}
.photo-edit img{width:100%;height:100%;object-fit:cover;}
.photo-edit .photo-placeholder{font-size:4rem;color:#b8a48e;}
.photo-edit:hover::after{content:"📷 点击上传";position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;font-size:.9rem;display:flex;align-items:center;justify-content:center;font-weight:600;}
.photo-edit.uploading::after{content:"⏳ 上传中...";position:absolute;inset:0;background:rgba(0,0,0,.65);color:#fff;font-size:.9rem;display:flex;align-items:center;justify-content:center;font-weight:600;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:.82rem;font-weight:700;color:#6d5c4a;}
.field input,.field textarea{width:100%;padding:11px 14px;border:1px solid #e0d6cc;border-radius:10px;font-size:.92rem;background:#fcf9f6;color:#2e2a24;font-family:inherit;}
.field input:focus,.field textarea:focus{outline:none;border-color:#b8a48e;background:#fffbf7;}
.field textarea{resize:vertical;min-height:60px;}
.field input:disabled,.field textarea:disabled{opacity:.6;cursor:not-allowed;}
.attend-box{background:#fcf9f6;border:1px solid #f0e7df;border-radius:14px;padding:14px;text-align:center;margin-bottom:16px;}
.attend-box .row{display:flex;align-items:center;justify-content:center;gap:14px;}
.switch{position:relative;display:inline-block;width:60px;height:34px;cursor:pointer;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:#d6cdc0;border-radius:34px;transition:.2s;}
.slider::before{content:'';position:absolute;height:26px;width:26px;left:4px;bottom:4px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.switch input:checked + .slider{background:#7cae6b;}
.switch input:checked + .slider::before{transform:translateX(26px);}
.attend-label{font-size:1rem;font-weight:700;color:#8a7663;}
.attend-label.on{color:#2b6e2b;}
.res-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.res-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fcf9f6;border:1px solid #f0e7df;border-radius:10px;font-size:.85rem;}
.res-item img{max-width:60px;max-height:60px;border-radius:6px;}
.res-item .res-info{flex:1;min-width:0;}
.res-item .res-label{color:#4e443b;font-weight:600;}
.res-item .res-url{color:#a8907a;font-size:.75rem;word-break:break-all;}
.res-del{background:#fce9e9;border:1px solid #e6c1c1;color:#b34141;font-size:.72rem;padding:4px 10px;border-radius:6px;cursor:pointer;}
.res-del:hover{background:#f8d7d7;}
.add-res-bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.add-res-bar button{background:#f6f0e8;border:1px dashed #c0a68b;color:#6d5a45;font-size:.8rem;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
.add-res-bar button:hover{background:#efe6d9;}
.save-btn{width:100%;background:#3a332c;color:#fff;border:none;border-radius:30px;padding:14px;font-weight:700;font-size:1rem;cursor:pointer;margin-top:10px;transition:.15s;}
.save-btn:hover{background:#2b251f;}
.save-btn:disabled{opacity:.5;cursor:not-allowed;}
.status-bar{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:#3a332c;color:#fff;padding:10px 22px;border-radius:30px;font-size:.85rem;font-weight:600;z-index:9999;transition:.25s;box-shadow:0 8px 20px rgba(0,0,0,.2);}
.status-bar.show{transform:translateX(-50%) translateY(0);}
.status-bar.saved{background:#2b6e2b;}
.status-bar.error{background:#b34141;}
.status-bar.saving{background:#8a6d3b;}
.loading,.error-box{text-align:center;padding:48px 16px;color:#a8907a;font-size:.95rem;}
.error-box{color:#a12b35;background:#f8d7da;border-radius:14px;}
.notice{background:#fff8e6;border:1px solid #f0e0b8;color:#8a6d3b;font-size:.82rem;padding:10px 14px;border-radius:10px;margin-bottom:14px;}
</style>
</head>
<body>
<div class="app-wrapper">
  <div class="header">
    <h1>The Forest</h1>
    <p>我的资料 · 自助修改</p>
    <div class="today" id="todayDate"></div>
  </div>
  <div id="content">
    <div class="loading"><i class="fas fa-spinner fa-spin"></i> 正在加载...</div>
  </div>
</div>
<div class="status-bar" id="statusBar">保存中...</div>

<script>
const WORKER = 'https://theforest-d3gv9fhgk94d9ed1b-1498940267.ap-shanghai.app.tcloudbase.com';
const CLOUD_NAME = 'h6vw5ogh';
const UPLOAD_PRESET = 'forest_photos';

const CATEGORY_MAP = {
  '轻无树洞': '轻无树洞',
  '游戏主持': '游戏主持',
  '歌手': '歌手',
  '画手': '画手',
  'STAFF': '前台&店长'
};

const RESOURCE_CFG = {
  '歌手': {btn:'歌单',icon:'fa-music'},
  '画手': {btn:'例图',icon:'fa-image'},
  '游戏主持': {btn:'游戏单',icon:'fa-dice'}
};

let DATA = null;
let MY_CATEGORY = null;
let MY_INDEX = -1;
let MY_SECRET = null;

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showToday(){
  const now = new Date();
  const wd = ['日','一','二','三','四','五','六'];
  $('todayDate').textContent = now.getMonth()+1+'月'+now.getDate()+'日 · 周'+wd[now.getDay()];
}

function status(text, cls){
  const el = $('statusBar');
  el.textContent = text;
  el.className = 'status-bar show' + (cls ? ' '+cls : '');
  if(cls === 'saved' || cls === 'error') setTimeout(()=>el.classList.remove('show'), 2000);
}

function getSecret(){
  const params = new URLSearchParams(location.search);
  return params.get('secret');
}

async function uploadToCloudinary(file){
  const url = 'https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload';
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', UPLOAD_PRESET);
  const res = await fetch(url, {method:'POST', body: fd});
  if(!res.ok) throw new Error('上传失败：'+res.status);
  const json = await res.json();
  return json.secure_url || json.url;
}

async function load(){
  MY_SECRET = getSecret();
  if(!MY_SECRET){
    $('content').innerHTML = '<div class="error-box"><i class="fas fa-exclamation-triangle"></i> 缺少访问码<br><small>请使用你专属的链接打开本页面</small></div>';
    return;
  }
  try{
    const res = await fetch(WORKER + '/data', {cache:'no-store'});
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || '加载失败');
    DATA = json.data;
    DATA.staffData = DATA.staffData || {};

    let found = false;
    for(const key of Object.keys(DATA.staffData)){
      const arr = DATA.staffData[key];
      const idx = arr.findIndex(s => s.secret === MY_SECRET);
      if(idx !== -1){
        MY_CATEGORY = key;
        MY_INDEX = idx;
        found = true;
        break;
      }
    }
    if(!found){
      $('content').innerHTML = '<div class="error-box"><i class="fas fa-times-circle"></i> 访问码无效<br><small>请联系店长获取新链接</small></div>';
      return;
    }
    render();
  }catch(e){
    $('content').innerHTML = '<div class="error-box"><i class="fas fa-exclamation-triangle"></i> 加载失败：'+esc(e.message)+'</div>';
  }
}

function getMe(){
  return DATA.staffData[MY_CATEGORY][MY_INDEX];
}

function render(){
  const me = getMe();
  const cfg = RESOURCE_CFG[MY_CATEGORY];
  const canEditResources = !!cfg;

  let html = '';
  html += '<div class="notice"><i class="fas fa-info-circle"></i> 你只能修改自己的资料。名字和职位由店长管理，如需更改请联系店长。</div>';

  const photoHtml = me.photo
    ? '<img src="'+esc(me.photo)+'" alt="">'
    : '<div class="photo-placeholder"><i class="fas fa-user-circle"></i></div>';
  html += '<div class="photo-edit" id="photoEdit">'+photoHtml+'</div>';

  html += '<div class="field"><label>姓名（不可改）</label><input type="text" value="'+esc(me.name||'')+'" disabled></div>';
  html += '<div class="field"><label>职位（不可改）</label><input type="text" value="'+esc(me.role||'')+'" disabled></div>';
  html += '<div class="field"><label>我的介绍</label><textarea id="f_details" placeholder="一句话介绍自己">'+esc(me.details||'')+'</textarea></div>';

  html += '<div class="attend-box"><div class="row">';
  html += '<span class="attend-label '+(me.present?'on':'')+'" id="attendLabel">'+(me.present?'今日出勤':'今日休息')+'</span>';
  html += '<label class="switch"><input type="checkbox" id="f_present" '+(me.present?'checked':'')+'><span class="slider"></span></label>';
  html += '</div></div>';

  if(canEditResources){
    html += '<div class="field"><label>'+esc(cfg.btn)+'</label>';
    html += '<div class="res-list" id="resList"></div>';
    html += '<div class="add-res-bar">';
    html += '<button id="addImgBtn"><i class="fas fa-image"></i> 上传图片</button>';
    html += '<button id="addLinkBtn"><i class="fas fa-link"></i> 加链接</button>';
    html += '</div></div>';
  }

  html += '<button class="save-btn" id="saveBtn"><i class="fas fa-save"></i> 保存我的资料</button>';

  $('content').innerHTML = html;

  renderResources();

  $('photoEdit').onclick = ()=>{
    const inp = document.createElement('input');
    inp.type='file';inp.accept='image/*';
    inp.onchange = async e=>{
      const f = e.target.files[0];if(!f)return;
      const el = $('photoEdit');
      el.classList.add('uploading');
      try{
        const url = await uploadToCloudinary(f);
        getMe().photo = url;
        status('照片上传成功，记得点保存','saved');
        render();
      }catch(err){
        status('上传失败：'+err.message,'error');
      }
    };
    inp.click();
  };

  $('f_present').onchange = e => {
    const me = getMe();
    me.present = e.target.checked;
    const lb = $('attendLabel');
    lb.textContent = e.target.checked ? '今日出勤' : '今日休息';
    lb.classList.toggle('on', e.target.checked);
  };

  $('saveBtn').onclick = async ()=>{
    const me = getMe();
    me.details = $('f_details').value;
    $('saveBtn').disabled = true;
    status('保存中...','saving');
    try{
      const res = await fetch(WORKER + '/update-self', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          secret: MY_SECRET,
          present: me.present,
          details: me.details,
          photo: me.photo,
          resources: me.resources
        })
      });
      const json = await res.json();
      if(!json.ok) throw new Error(json.error || '保存失败');
      status('已保存 ✓','saved');
    }catch(e){
      status('保存失败：'+e.message,'error');
    }finally{
      $('saveBtn').disabled = false;
    }
  };

  if(canEditResources){
    $('addImgBtn').onclick = ()=>{
      const inp = document.createElement('input');
      inp.type='file';inp.accept='image/*';
      inp.onchange = async e=>{
        const f = e.target.files[0];if(!f)return;
        const label = prompt('给这张图片起个名字：','图片');
        if(label===null)return;
        try{
          status('上传中...','saving');
          const url = await uploadToCloudinary(f);
          const me = getMe();
          me.resources = me.resources || [];
          me.resources.push({type:'image', data:url, label:label||'未命名'});
          status('图片上传成功，记得点保存','saved');
          render();
        }catch(err){
          status('上传失败：'+err.message,'error');
        }
      };
      inp.click();
    };
    $('addLinkBtn').onclick = ()=>{
      const url = prompt('输入链接（https:// 开头）：','https://');
      if(!url) return;
      const label = prompt('给这个链接起个名字：','链接');
      if(label===null) return;
      const me = getMe();
      me.resources = me.resources || [];
      me.resources.push({type:'link', url:url, label:label||url});
      renderResources();
      status('已添加，记得点保存','saved');
    };
  }
}

function renderResources(){
  const cfg = RESOURCE_CFG[MY_CATEGORY];
  if(!cfg) return;
  const me = getMe();
  const resources = me.resources || [];
  const list = $('resList');
  if(!list) return;
  if(resources.length === 0){
    list.innerHTML = '<div style="text-align:center;color:#b8a48e;font-size:.82rem;padding:8px;">暂无内容</div>';
    return;
  }
  let html = '';
  resources.forEach((r, i)=>{
    html += '<div class="res-item">';
    if(r.type === 'image'){
      if(r.data) html += '<img src="'+esc(r.data)+'" alt="">';
      else html += '<div style="width:60px;height:60px;background:#f0e7df;border-radius:6px;"></div>';
      html += '<div class="res-info"><div class="res-label">'+esc(r.label||'未命名')+'</div><div class="res-url">图片</div></div>';
    }else{
      html += '<i class="fas fa-link" style="color:#a8907a;font-size:1.2rem;"></i>';
      html += '<div class="res-info"><div class="res-label">'+esc(r.label||'')+'</div><div class="res-url">'+esc(r.url||'')+'</div></div>';
    }
    html += '<button class="res-del" data-res-del="'+i+'">删除</button>';
    html += '</div>';
  });
  list.innerHTML = html;

  list.querySelectorAll('[data-res-del]').forEach(el=>{
    el.onclick = ()=>{
      const i = +el.dataset.resDel;
      if(!confirm('删除这条内容？')) return;
      getMe().resources.splice(i,1);
      renderResources();
      status('已删除，记得点保存','saved');
    };
  });
}

showToday();
load();
</script>
</body>
</html>
