<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Forest · 店员花名册</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;}
body{background:#f7f3ee;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px;}
.app-wrapper{max-width:820px;width:100%;background:#fff;border-radius:36px;box-shadow:0 20px 40px rgba(0,0,0,.08),0 6px 12px rgba(0,0,0,.05);padding:28px 24px 36px;}
.shop-header{display:flex;flex-direction:column;align-items:center;margin-bottom:18px;}
.shop-name{font-size:2.6rem;font-weight:700;color:#2e2a24;text-align:center;line-height:1.2;word-break:break-word;width:100%;padding:0 8px;font-family:Georgia,'Times New Roman',serif;}
.status-area{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;flex-wrap:wrap;}
.biz-status{font-size:1.1rem;font-weight:600;padding:8px 18px;border-radius:60px;display:inline-flex;align-items:center;gap:8px;border:2px solid transparent;}
.biz-status.open{background:#dff0d8;color:#2b6e2b;border-color:#b1d8a8;}
.biz-status.closed{background:#f8d7da;color:#a12b35;border-color:#f1b0b7;}
.info-strip{display:flex;flex-direction:column;gap:10px;margin:16px 0 4px;width:100%;}
.info-item{display:flex;align-items:flex-start;gap:10px;background:#fcf9f6;border:1px solid #f0e7df;border-left:4px solid #c9b8a3;border-radius:12px;padding:12px 16px;font-size:.92rem;color:#4e443b;line-height:1.55;}
.info-item i{color:#a8907a;margin-top:3px;flex-shrink:0;font-size:.95rem;}
.info-item .info-label{font-weight:700;color:#6d5c4a;margin-right:4px;}
.info-item .info-content{flex:1;word-break:break-word;min-width:0;}
.category-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0 20px;}
.category-btn{background:#f1ebe4;border:none;border-radius:30px;padding:14px 6px;font-weight:600;font-size:.88rem;color:#423a32;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all .2s;border:2px solid transparent;line-height:1.3;text-align:center;word-break:break-word;}
.category-btn i{font-size:1.4rem;color:#7c6b5c;}
.category-btn.active{background:#e6d9cd;border-color:#b8a48e;color:#1f1a16;box-shadow:0 8px 16px rgba(140,110,80,.1);}
.category-btn.active i{color:#4b3e32;}
.list-header{margin:18px 0 12px;}
.list-header h2{font-size:1.5rem;font-weight:600;color:#2e2a24;display:flex;align-items:center;gap:8px;}
.staff-list{display:flex;flex-direction:column;gap:20px;max-height:560px;overflow-y:auto;padding:4px 6px 8px 4px;border-radius:24px;}
.staff-list::-webkit-scrollbar{width:6px;}
.staff-list::-webkit-scrollbar-track{background:#f7f3ee;border-radius:10px;}
.staff-list::-webkit-scrollbar-thumb{background:#d6cdc0;border-radius:10px;}
.staff-card{display:flex;background:#fcf9f6;border-radius:20px;padding:18px;gap:18px;box-shadow:0 4px 14px rgba(0,0,0,.04);border:1px solid #f0e7df;align-items:stretch;}
.staff-photo{width:50%;aspect-ratio:1/1;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#e9e1d7;border:1px solid #d9cbb9;box-shadow:0 0 0 6px #fcf9f6,0 0 0 7px #d9cbb9,0 8px 20px rgba(140,110,80,.12);border-radius:6px;}
.staff-photo::before{content:'';position:absolute;inset:8px;border:1px solid rgba(180,155,125,.55);border-radius:3px;pointer-events:none;z-index:2;}
.staff-photo::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;
background:
linear-gradient(#b8a48e,#b8a48e) left 4px top 4px/16px 2px no-repeat,
linear-gradient(#b8a48e,#b8a48e) left 4px top 4px/2px 16px no-repeat,
linear-gradient(#b8a48e,#b8a48e) right 4px top 4px/16px 2px no-repeat,
linear-gradient(#b8a48e,#b8a48e) right 4px top 4px/2px 16px no-repeat,
linear-gradient(#b8a48e,#b8a48e) left 4px bottom 4px/16px 2px no-repeat,
linear-gradient(#b8a48e,#b8a48e) left 4px bottom 4px/2px 16px no-repeat,
linear-gradient(#b8a48e,#b8a48e) right 4px bottom 4px/16px 2px no-repeat,
linear-gradient(#b8a48e,#b8a48e) right 4px bottom 4px/2px 16px no-repeat;}
.staff-photo img{width:100%;height:100%;object-fit:cover;border-radius:3px;display:block;position:relative;z-index:1;}
.staff-photo .photo-placeholder{font-size:3.5rem;color:#b8a48e;z-index:1;}
.staff-info{flex:1;width:50%;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:4px 4px 4px 0;}
.staff-name{font-size:1.4rem;font-weight:700;color:#2e2a24;margin-bottom:6px;line-height:1.25;word-break:break-word;}
.staff-role{font-size:.95rem;color:#8a7663;margin-bottom:10px;font-weight:500;}
.staff-details{font-size:.9rem;color:#4e443b;line-height:1.55;word-break:break-word;}
.attendance-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:60px;font-size:.8rem;font-weight:600;width:fit-content;margin-top:10px;}
.attendance-badge.present{background:#dff0d8;color:#2b6e2b;}
.attendance-badge.absent{background:#f8d7da;color:#a12b35;}
.resource-btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#f6ecdf,#ecdfcd);border:1px solid #d9c7b0;color:#6d5a45;font-size:.82rem;font-weight:600;padding:7px 14px;border-radius:40px;cursor:pointer;margin-top:10px;width:fit-content;transition:.2s;}
.resource-btn:hover{background:linear-gradient(135deg,#ecdfcd,#e2d1ba);border-color:#c8b096;transform:translateY(-1px);}
.empty-state{text-align:center;padding:48px 16px;color:#b8a48e;font-weight:500;background:#fcf9f6;border-radius:40px;}
.loading{text-align:center;padding:48px;color:#a8907a;}
.modal-overlay{position:fixed;inset:0;background:rgba(40,33,26,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
.modal-box{background:#fffdfa;border-radius:24px;max-width:640px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(0,0,0,.3);overflow:hidden;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #f0e7df;background:#fcf9f6;}
.modal-title{font-size:1.2rem;font-weight:700;color:#2e2a24;display:flex;align-items:center;gap:8px;}
.modal-title i{color:#a8907a;}
.modal-close{background:transparent;border:none;font-size:1.5rem;color:#8a7663;cursor:pointer;padding:4px 10px;border-radius:8px;line-height:1;}
.modal-close:hover{background:#f0e7df;color:#2e2a24;}
.modal-body{padding:20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;}
.modal-image{width:100%;border-radius:12px;border:1px solid #e6dbc9;display:block;}
.modal-link{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#f6f0e8;border-radius:12px;border:1px solid #e6dbc9;color:#5e4b3a;text-decoration:none;font-weight:600;font-size:.95rem;word-break:break-all;}
.modal-link:hover{background:#efe6d9;}
.modal-link i{color:#a8907a;flex-shrink:0;}
.modal-empty{text-align:center;padding:40px 16px;color:#b8a48e;font-size:.95rem;}
.modal-empty i{font-size:2.5rem;display:block;margin-bottom:12px;color:#d9cbb9;}
@media(max-width:480px){
.category-grid{grid-template-columns:repeat(3,1fr);}
.staff-card{flex-direction:column;}
.staff-photo{width:100%;aspect-ratio:4/3;}
.staff-info{width:100%;}
.category-btn{font-size:.78rem;padding:12px 4px;}
.category-btn i{font-size:1.2rem;}
}
</style>
</head>
<body>
<div class="app-wrapper">
  <div class="shop-header">
    <div class="shop-name" id="shopName">The Forest</div>
    <div class="status-area">
      <span class="biz-status open" id="bizStatus"><i class="fas fa-door-open"></i> 营业中</span>
    </div>
  </div>

  <div class="info-strip" id="infoStrip"></div>

  <div class="category-grid" id="categoryGrid">
    <button class="category-btn active" data-category="轻无树洞"><i class="fas fa-tree"></i> 轻无树洞</button>
    <button class="category-btn" data-category="游戏主持"><i class="fas fa-gamepad"></i> 游戏主持</button>
    <button class="category-btn" data-category="歌手"><i class="fas fa-microphone-alt"></i> 歌手</button>
    <button class="category-btn" data-category="画手"><i class="fas fa-paint-brush"></i> 画手</button>
    <button class="category-btn" data-category="STAFF"><i class="fas fa-concierge-bell"></i> 前台&店长</button>
  </div>

  <div class="list-header">
    <h2 id="currentCategoryTitle"><i class="fas fa-users"></i> 轻无树洞</h2>
  </div>

  <div class="staff-list" id="staffList">
    <div class="loading"><i class="fas fa-spinner fa-spin"></i> 正在加载...</div>
  </div>
</div>

<script>
const WORKER = 'https://theforest-d3gv9fhgk94d9ed1b-1498940267.ap-shanghai.app.tcloudbase.com';

const CATEGORY_MAP = {
  '轻无树洞': '轻无树洞',
  '游戏主持': '游戏主持',
  '歌手': '歌手',
  '画手': '画手',
  'STAFF': '前台&店长'
};

const RESOURCE_CFG = {
  '歌手': {btn:'歌单',icon:'fa-music',title:'歌单'},
  '画手': {btn:'例图',icon:'fa-image',title:'例图 & 价目表'},
  '游戏主持': {btn:'游戏单',icon:'fa-dice',title:'游戏单'}
};

let DATA = null;
let currentCategory = '轻无树洞';

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load(){
  try{
    const res = await fetch(WORKER + '/data', {cache:'no-store'});
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || '加载失败');
    DATA = json.data;
    renderAll();
  }catch(e){
    $('staffList').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><br>数据加载失败<br><small>'+esc(e.message)+'</small></div>';
  }
}

function renderAll(){
  $('shopName').textContent = DATA.shopName || 'The Forest';
  const bs = $('bizStatus');
  if(DATA.isOpen){
    bs.className = 'biz-status open';
    bs.innerHTML = '<i class="fas fa-door-open"></i> 营业中';
  }else{
    bs.className = 'biz-status closed';
    bs.innerHTML = '<i class="fas fa-door-closed"></i> 已打烊';
  }
  let infoHtml = '';
  if(DATA.Openinghours){
    infoHtml += '<div class="info-item"><i class="fas fa-clock"></i><div class="info-content"><span class="info-label">营业时间：</span>'+esc(DATA.Openinghours)+'</div></div>';
  }
  if(DATA.audienceInfo){
    infoHtml += '<div class="info-item"><i class="fas fa-users"></i><div class="info-content"><span class="info-label">客群：</span>'+esc(DATA.audienceInfo)+'</div></div>';
  }
  if(DATA.recruitInfo){
    infoHtml += '<div class="info-item"><i class="fas fa-bullhorn"></i><div class="info-content"><span class="info-label">招募：</span>'+esc(DATA.recruitInfo)+'</div></div>';
  }
  $('infoStrip').innerHTML = infoHtml;
  renderList();
}

function renderList(){
  const arr = (DATA.staffData && DATA.staffData[currentCategory]) || [];
  const displayName = CATEGORY_MAP[currentCategory] || currentCategory;
  $('currentCategoryTitle').innerHTML = '<i class="fas fa-users"></i> '+esc(displayName);

  if(arr.length===0){
    $('staffList').innerHTML = '<div class="empty-state"><i class="fas fa-user-slash" style="font-size:2rem;margin-bottom:12px;display:block;"></i>暂无店员</div>';
    return;
  }

  const cfg = RESOURCE_CFG[currentCategory];
  let html = '';
  arr.forEach(staff=>{
    const photoHtml = staff.photo
      ? '<img src="'+esc(staff.photo)+'" alt="'+esc(staff.name)+'" onerror="this.outerHTML=\'<div class=\\\'photo-placeholder\\\'><i class=\\\'fas fa-user-circle\\\'></i></div>\'">'
      : '<div class="photo-placeholder"><i class="fas fa-user-circle"></i></div>';

    const attend = staff.present
      ? '<span class="attendance-badge present"><i class="fas fa-check-circle"></i> 今日出勤</span>'
      : '<span class="attendance-badge absent"><i class="fas fa-times-circle"></i> 今日休息</span>';

    let resBtn = '';
    if(cfg){
      resBtn = '<button class="resource-btn" data-res-id="'+staff.id+'"><i class="fas '+cfg.icon+'"></i> '+esc(cfg.btn)+'</button>';
    }

    html += '<div class="staff-card">'+
      '<div class="staff-photo">'+photoHtml+'</div>'+
      '<div class="staff-info">'+
      '<div class="staff-name">'+esc(staff.name)+'</div>'+
      '<div class="staff-role">'+esc(staff.role)+'</div>'+
      '<div class="staff-details">'+esc(staff.details)+'</div>'+
      attend+ resBtn +
      '</div></div>';
  });
  $('staffList').innerHTML = html;

  $('staffList').querySelectorAll('.resource-btn').forEach(btn=>{
    btn.onclick = () => openResourceModal(btn.dataset.resId);
  });
}

function openResourceModal(staffId){
  const arr = (DATA.staffData && DATA.staffData[currentCategory]) || [];
  const staff = arr.find(s=>s.id===staffId);
  if(!staff) return;
  const cfg = RESOURCE_CFG[currentCategory];
  if(!cfg) return;
  const resources = staff.resources || [];

  let bodyHtml = '';
  if(resources.length===0){
    bodyHtml = '<div class="modal-empty"><i class="fas fa-inbox"></i>暂无'+esc(cfg.btn)+'内容</div>';
  }else{
    resources.forEach(r=>{
      if(r.type==='image'){
        bodyHtml += r.data
          ? '<img class="modal-image" src="'+esc(r.data)+'" alt="'+esc(r.label||'')+'">'
          : '<div class="modal-empty">（图片未上传）</div>';
      }else if(r.type==='link'){
        bodyHtml += '<a class="modal-link" href="'+esc(r.url)+'" target="_blank" rel="noopener"><i class="fas fa-link"></i><span>'+esc(r.label||r.url)+'</span></a>';
      }
    });
  }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML =
    '<div class="modal-box">'+
    '<div class="modal-header">'+
    '<div class="modal-title"><i class="fas '+cfg.icon+'"></i> '+esc(staff.name)+' · '+esc(cfg.title)+'</div>'+
    '<button class="modal-close">&times;</button>'+
    '</div>'+
    '<div class="modal-body">'+bodyHtml+'</div>'+
    '</div>';
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelector('.modal-close').onclick = close;
  overlay.onclick = e => { if(e.target===overlay) close(); };
}

document.getElementById('categoryGrid').addEventListener('click', e=>{
  const btn = e.target.closest('.category-btn');
  if(!btn) return;
  currentCategory = btn.dataset.category;
  document.querySelectorAll('.category-btn').forEach(b=>b.classList.toggle('active', b===btn));
  renderList();
});

load();
</script>
</body>
</html>
