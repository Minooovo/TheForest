<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Forest · 出勤打卡</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
body{background:#f7f3ee;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px;}
.app-wrapper{max-width:720px;width:100%;background:#fff;border-radius:36px;box-shadow:0 20px 40px rgba(0,0,0,.08);padding:28px 24px 36px;}
.header{text-align:center;margin-bottom:24px;}
.header h1{font-size:1.8rem;color:#2e2a24;font-family:Georgia,serif;margin-bottom:6px;}
.header p{font-size:.9rem;color:#8a7663;}
.header .today{display:inline-block;margin-top:10px;background:#f1ebe4;color:#5e4b3a;padding:6px 16px;border-radius:30px;font-size:.85rem;font-weight:600;}
.cat-block{margin-bottom:24px;}
.cat-title{font-size:1rem;font-weight:700;color:#6d5c4a;margin-bottom:10px;display:flex;align-items:center;gap:8px;border-left:4px solid #c9b8a3;padding-left:12px;}
.staff-row{display:flex;align-items:center;gap:14px;background:#fcf9f6;border:1px solid #f0e7df;border-radius:14px;padding:12px 14px;margin-bottom:8px;transition:.15s;}
.staff-row.checked{background:#f0f7ee;border-color:#b1d8a8;}
.staff-avatar{width:48px;height:48px;flex-shrink:0;border-radius:50%;overflow:hidden;background:#e9e1d7;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.06);}
.staff-avatar img{width:100%;height:100%;object-fit:cover;}
.staff-avatar i{font-size:1.5rem;color:#b8a48e;}
.staff-info{flex:1;min-width:0;}
.staff-name{font-size:1.05rem;font-weight:700;color:#2e2a24;margin-bottom:2px;word-break:break-word;}
.staff-role{font-size:.82rem;color:#8a7663;}
.attend-switch{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.switch{position:relative;display:inline-block;width:52px;height:30px;cursor:pointer;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:#d6cdc0;border-radius:30px;transition:.2s;}
.slider::before{content:'';position:absolute;height:22px;width:22px;left:4px;bottom:4px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.switch input:checked + .slider{background:#7cae6b;}
.switch input:checked + .slider::before{transform:translateX(22px);}
.switch-label{font-size:.75rem;font-weight:600;color:#8a7663;min-width:32px;text-align:right;}
.switch-label.on{color:#2b6e2b;}
.save-status{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:#3a332c;color:#fff;padding:12px 24px;border-radius:30px;font-size:.88rem;font-weight:600;z-index:9999;box-shadow:0 8px 20px rgba(0,0,0,.2);transition:.25s;}
.save-status.show{transform:translateX(-50%) translateY(0);}
.save-status.saving{background:#8a6d3b;}
.save-status.saved{background:#2b6e2b;}
.save-status.error{background:#b34141;}
.loading{text-align:center;padding:60px;color:#a8907a;}
.error-box{background:#f8d7da;color:#a12b35;padding:16px;border-radius:12px;margin-bottom:20px;font-size:.9rem;}
.no-staff{text-align:center;padding:48px 16px;color:#b8a48e;font-size:.9rem;}
</style>
</head>
<body>
<div class="app-wrapper">
  <div class="header">
    <h1>The Forest</h1>
    <p>今日出勤打卡</p>
    <div class="today" id="todayDate">加载中...</div>
  </div>
  <div id="content">
    <div class="loading"><i class="fas fa-spinner fa-spin"></i> 正在加载数据...</div>
  </div>
</div>
<div class="save-status" id="saveStatus">保存中...</div>

<script>
const WORKER = 'https://forest-api.evava-shen.workers.dev';

const CATEGORY_MAP = {
  '轻无树洞': '轻无树洞',
  '游戏主持': '游戏主持',
  '歌手': '歌手',
  '画手': '画手',
  'STAFF': '前台&店长'
};

let DATA = null;
let saveTimer = null;
const pendingChanges = new Set();

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showToday(){
  const now = new Date();
  const wd = ['日','一','二','三','四','五','六'];
  $('todayDate').textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 · 周'+wd[now.getDay()];
}

function toast(text, cls){
  const el = $('saveStatus');
  el.textContent = text;
  el.className = 'save-status show'+(cls?' '+cls:'');
  if(cls === 'saved' || cls === 'error') setTimeout(()=>el.classList.remove('show'), 2000);
}

async function load(){
  try{
    const res = await fetch(WORKER + '/data', {cache:'no-store'});
    const json = await res.json();
    if(!json.ok) throw new Error(json.error);
    DATA = json.data;
    DATA.staffData = DATA.staffData || {};
    render();
  }catch(e){
    $('content').innerHTML = '<div class="error-box">加载失败：'+esc(e.message)+'</div>';
  }
}

function render(){
  let html = '';
  let hasAny = false;

  Object.keys(CATEGORY_MAP).forEach(key=>{
    const arr = DATA.staffData[key] || [];
    if(arr.length === 0) return;
    hasAny = true;
    html += '<div class="cat-block">';
    html += '<div class="cat-title"><i class="fas fa-folder"></i> '+esc(CATEGORY_MAP[key])+'</div>';
    arr.forEach((staff, idx)=>{
      const photo = staff.photo
        ? '<img src="'+esc(staff.photo)+'" alt="">'
        : '<i class="fas fa-user-circle"></i>';
      const checked = staff.present ? 'checked' : '';
      const rowCls = staff.present ? 'checked' : '';
      const labelText = staff.present ? '出勤' : '休息';
      const labelCls = staff.present ? 'on' : '';
      html += '<div class="staff-row '+rowCls+'" data-key="'+esc(key)+'" data-idx="'+idx+'">';
      html += '<div class="staff-avatar">'+photo+'</div>';
      html += '<div class="staff-info">';
      html += '<div class="staff-name">'+esc(staff.name||'')+'</div>';
      html += '<div class="staff-role">'+esc(staff.role||'')+'</div>';
      html += '</div>';
      html += '<div class="attend-switch">';
      html += '<label class="switch"><input type="checkbox" data-key="'+esc(key)+'" data-idx="'+idx+'" '+checked+'><span class="slider"></span></label>';
      html += '<span class="switch-label '+labelCls+'">'+labelText+'</span>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
  });

  if(!hasAny){
    html = '<div class="no-staff"><i class="fas fa-user-slash" style="font-size:2rem;display:block;margin-bottom:12px;"></i>暂无店员</div>';
  }

  $('content').innerHTML = html;

  $('content').querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.onchange = ()=>{
      const key = cb.dataset.key;
      const idx = +cb.dataset.idx;
      DATA.staffData[key][idx].present = cb.checked;
      pendingChanges.add(key + '_' + idx);
      const row = cb.closest('.staff-row');
      row.classList.toggle('checked', cb.checked);
      const label = row.querySelector('.switch-label');
      label.textContent = cb.checked ? '出勤' : '休息';
      label.classList.toggle('on', cb.checked);
      scheduleSave();
    };
  });
}

function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  toast('保存中...', 'saving');
  saveTimer = setTimeout(doSave, 800);
}

async function doSave(){
  const changes = [];
  pendingChanges.forEach(k => {
    const [key, idx] = k.split('_');
    const staff = DATA.staffData[key][+idx];
    if(staff.secret){
      changes.push({ secret: staff.secret, present: staff.present });
    }
  });
  pendingChanges.clear();

  try{
    for(const ch of changes){
      const res = await fetch(WORKER + '/update-attendance', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(ch)
      });
      const json = await res.json();
      if(!json.ok) throw new Error(json.error);
    }
    toast('已保存 ✓', 'saved');
  }catch(e){
    toast('保存失败：'+e.message, 'error');
  }
}

showToday();
load();
</script>
</body>
</html>
