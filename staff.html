<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Forest · 出勤打卡</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
body{background:#f7f3ee;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px;}
.app-wrapper{max-width:720px;width:100%;background:#fff;border-radius:36px;box-shadow:0 20px 40px rgba(0,0,0,.08);padding:28px 24px 36px;}
.header{text-align:center;margin-bottom:24px;}
.header h1{font-size:1.8rem;color:#2e2a24;font-family:Georgia,serif;margin-bottom:6px;}
.header p{font-size:.9rem;color:#8a7663;}
.header .today{display:inline-block;margin-top:10px;background:#f1ebe4;color:#5e4b3a;padding:6px 16px;border-radius:30px;font-size:.85rem;font-weight:600;}
.biz-toggle-wrap{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;background:#fcf9f6;border:1px solid #f0e7df;border-radius:30px;padding:8px 16px;width:fit-content;margin-left:auto;margin-right:auto;}
.biz-label{font-size:.95rem;font-weight:700;color:#8a7663;}
.biz-label.open{color:#2b6e2b;}
.biz-label.closed{color:#a12b35;}
.biz-switch{position:relative;display:inline-block;width:52px;height:30px;cursor:pointer;flex-shrink:0;}
.biz-switch input{opacity:0;width:0;height:0;}
.biz-switch .slider{position:absolute;inset:0;background:#d6cdc0;border-radius:30px;transition:.2s;}
.biz-switch .slider::before{content:'';position:absolute;height:22px;width:22px;left:4px;bottom:4px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.biz-switch input:checked + .slider{background:#7cae6b;}
.biz-switch input:checked + .slider::before{transform:translateX(22px);}
.cat-block{margin-bottom:24px;}
.cat-title{font-size:1rem;font-weight:700;color:#6d5c4a;margin-bottom:10px;display:flex;align-items:center;gap:8px;border-left:4px solid #c9b8a3;padding-left:12px;}
.staff-row{display:flex;align-items:center;gap:14px;background:#fcf9f6;border:1px solid #f0e7df;border-radius:14px;padding:12px 14px;margin-bottom:8px;transition:.15s;}
.staff-row.checked{background:#f0f7ee;border-color:#b1d8a8;}
.staff-avatar{width:48px;height:48px;flex-shrink:0;border-radius:50%;overflow:hidden;background:#e9e1d7;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.06);}
.staff-avatar img{width:100%;height:100%;object-fit:cover;}
.staff-avatar i{font-size:1.5rem;color:#b8a48e;}
.staff-info{flex:1;min-width:0;}
.staff-name{font-size:1.05rem;font-weight:700;color:#2e2a24;margin-bottom:2px;word-break:break-word;}
.staff-role{font-size:.82rem;color:#8a7663;}
.attend-switch{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.switch{position:relative;display:inline-block;width:52px;height:30px;cursor:pointer;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:#d6cdc0;border-radius:30px;transition:.2s;}
.slider::before{content:'';position:absolute;height:22px;width:22px;left:4px;bottom:4px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.switch input:checked + .slider{background:#7cae6b;}
.switch input:checked + .slider::before{transform:translateX(22px);}
.switch-label{font-size:.75rem;font-weight:600;color:#8a7663;min-width:32px;text-align:right;}
.switch-label.on{color:#2b6e2b;}
.cal-btn{background:#f6f0e8;border:1px solid #d9c7b0;color:#6d5a45;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.9rem;flex-shrink:0;}
.cal-btn:hover{background:#efe6d9;}
.save-status{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:#3a332c;color:#fff;padding:12px 24px;border-radius:30px;font-size:.88rem;font-weight:600;z-index:9999;box-shadow:0 8px 20px rgba(0,0,0,.2);transition:.25s;}
.save-status.show{transform:translateX(-50%) translateY(0);}
.save-status.saving{background:#8a6d3b;}
.save-status.saved{background:#2b6e2b;}
.save-status.error{background:#b34141;}
.loading{text-align:center;padding:60px;color:#a8907a;}
.error-box{background:#f8d7da;color:#a12b35;padding:16px;border-radius:12px;margin-bottom:20px;font-size:.9rem;}
.no-staff{text-align:center;padding:48px 16px;color:#b8a48e;font-size:.9rem;}
.modal-overlay{position:fixed;inset:0;background:rgba(40,33,26,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
.modal-box{background:#fffdfa;border-radius:24px;max-width:560px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(0,0,0,.3);overflow:hidden;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #f0e7df;background:#fcf9f6;}
.modal-title{font-size:1.1rem;font-weight:700;color:#2e2a24;display:flex;align-items:center;gap:8px;}
.modal-close{background:transparent;border:none;font-size:1.5rem;color:#8a7663;cursor:pointer;padding:4px 10px;border-radius:8px;line-height:1;}
.modal-body{padding:16px 20px;overflow-y:auto;}
.cal-legend{display:flex;gap:14px;margin-bottom:14px;font-size:.8rem;color:#8a7663;flex-wrap:wrap;}
.cal-legend .leg{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;}
.cal-legend .leg.present{background:#dff0d8;color:#2b6e2b;}
.cal-legend .leg.absent{background:#f8d7da;color:#a12b35;}
.cal-legend .leg.no-record{background:#f0e7df;color:#8a7663;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-day{background:#fcf9f6;border:1px solid #f0e7df;border-radius:8px;padding:8px 4px;text-align:center;font-size:.72rem;}
.cal-day.present{background:#dff0d8;border-color:#b1d8a8;color:#2b6e2b;}
.cal-day.absent{background:#f8d7da;border-color:#f1b0b7;color:#a12b35;}
.cal-day.no-record{opacity:.55;}
.cal-date{font-weight:700;margin-bottom:2px;}
.cal-week{color:#8a7663;font-size:.65rem;margin-bottom:3px;}
.cal-status{font-weight:700;font-size:.9rem;}
.cal-summary{background:#f6f0e8;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:.85rem;color:#5e4b3a;display:flex;justify-content:space-around;text-align:center;}
.cal-summary div{font-weight:700;}
.cal-summary .num{font-size:1.2rem;color:#3a332c;display:block;}
</style>
</head>
<body>
<div class="app-wrapper">
  <div class="header">
    <h1>The Forest</h1>
    <p>今日出勤打卡</p>
    <div class="today" id="todayDate">加载中...</div>
    <div class="biz-toggle-wrap">
      <span class="biz-label" id="bizLabel">加载中...</span>
      <label class="biz-switch">
        <input type="checkbox" id="bizToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  <div id="content">
    <div class="loading"><i class="fas fa-spinner fa-spin"></i> 正在加载数据...</div>
  </div>
</div>
<div class="save-status" id="saveStatus">保存中...</div>

<script>
const WORKER = 'https://theforest-d3gv9fhgk94d9ed1b-1498940267.ap-shanghai.app.tcloudbase.com';

const CATEGORY_MAP = {
  '轻无树洞': '轻无树洞',
  '游戏主持': '游戏主持',
  '歌手': '歌手',
  '画手': '画手',
  'STAFF': '前台&店长'
};

let DATA = null;
let saveTimer = null;
const pendingChanges = new Set();

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showToday(){
  const now = new Date();
  const wd = ['日','一','二','三','四','五','六'];
  $('todayDate').textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 · 周'+wd[now.getDay()];
}

function toast(text, cls){
  const el = $('saveStatus');
  el.textContent = text;
  el.className = 'save-status show'+(cls?' '+cls:'');
  if(cls === 'saved' || cls === 'error') setTimeout(()=>el.classList.remove('show'), 2000);
}

// ========== 营业状态开关 ==========
function renderBizToggle(){
  const toggle = $('bizToggle');
  const label = $('bizLabel');
  if(!DATA || !toggle || !label) return;

  toggle.checked = DATA.isOpen;
  label.textContent = DATA.isOpen ? '营业中' : '已打烊';
  label.className = 'biz-label ' + (DATA.isOpen ? 'open' : 'closed');

  toggle.onchange = async ()=>{
    const newState = toggle.checked;
    const oldState = DATA.isOpen;

    DATA.isOpen = newState;
    label.textContent = newState ? '营业中' : '已打烊';
    label.className = 'biz-label ' + (newState ? 'open' : 'closed');

    try{
      const res = await fetch(WORKER + '/toggle-open', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ isOpen: newState })
      });
      const json = await res.json();
      if(!json.ok) throw new Error(json.error || '切换失败');
      toast(newState ? '已开启营业' : '已打烊', 'saved');
    }catch(e){
      DATA.isOpen = oldState;
      toggle.checked = oldState;
      label.textContent = oldState ? '营业中' : '已打烊';
      label.className = 'biz-label ' + (oldState ? 'open' : 'closed');
      toast('切换失败：'+e.message, 'error');
    }
  };
}

async function load(){
  try{
    const res = await fetch(WORKER + '/data', {cache:'no-store'});
    const json = await res.json();
    if(!json.ok) throw new Error(json.error);
    DATA = json.data;
    DATA.staffData = DATA.staffData || {};
    render();
    renderBizToggle();
  }catch(e){
    $('content').innerHTML = '<div class="error-box">加载失败：'+esc(e.message)+'</div>';
  }
}

function render(){
  let html = '';
  let hasAny = false;

  Object.keys(CATEGORY_MAP).forEach(key=>{
    const arr = DATA.staffData[key] || [];
    if(arr.length === 0) return;
    hasAny = true;
    html += '<div class="cat-block">';
    html += '<div class="cat-title"><i class="fas fa-folder"></i> '+esc(CATEGORY_MAP[key])+'</div>';
    arr.forEach((staff, idx)=>{
      const photo = staff.photo
        ? '<img src="'+esc(staff.photo)+'" alt="">'
        : '<i class="fas fa-user-circle"></i>';
      const checked = staff.present ? 'checked' : '';
      const rowCls = staff.present ? 'checked' : '';
      const labelText = staff.present ? '出勤' : '休息';
      const labelCls = staff.present ? 'on' : '';
      html += '<div class="staff-row '+rowCls+'" data-key="'+esc(key)+'" data-idx="'+idx+'">';
      html += '<div class="staff-avatar">'+photo+'</div>';
      html += '<div class="staff-info">';
      html += '<div class="staff-name">'+esc(staff.name||'')+'</div>';
      html += '<div class="staff-role">'+esc(staff.role||'')+'</div>';
      html += '</div>';
      html += '<div class="attend-switch">';
      html += '<label class="switch"><input type="checkbox" data-key="'+esc(key)+'" data-idx="'+idx+'" '+checked+'><span class="slider"></span></label>';
      html += '<span class="switch-label '+labelCls+'">'+labelText+'</span>';
      html += '</div>';
      if(staff.secret){
        html += '<button class="cal-btn" data-cal-secret="'+esc(staff.secret)+'" data-cal-name="'+esc(staff.name)+'"><i class="fas fa-calendar-alt"></i></button>';
      }
      html += '</div>';
    });
    html += '</div>';
  });

  if(!hasAny){
    html = '<div class="no-staff"><i class="fas fa-user-slash" style="font-size:2rem;display:block;margin-bottom:12px;"></i>暂无店员</div>';
  }

  $('content').innerHTML = html;

  $('content').querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.onchange = ()=>{
      const key = cb.dataset.key;
      const idx = +cb.dataset.idx;
      DATA.staffData[key][idx].present = cb.checked;
      pendingChanges.add(key + '_' + idx);
      const row = cb.closest('.staff-row');
      row.classList.toggle('checked', cb.checked);
      const label = row.querySelector('.switch-label');
      label.textContent = cb.checked ? '出勤' : '休息';
      label.classList.toggle('on', cb.checked);
      scheduleSave();
    };
  });

  $('content').querySelectorAll('.cal-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      openCalendar(btn.dataset.calSecret, btn.dataset.calName);
    };
  });
}

function openCalendar(secret, name){
  let staff = null;
  for(const key of Object.keys(DATA.staffData)){
    const found = DATA.staffData[key].find(s => s.secret === secret);
    if(found){ staff = found; break; }
  }
  if(!staff) return;

  const log = staff.attendanceLog || {};
  const now = new Date();
  const chinaTime = new Date(now.getTime() + 8*60*60*1000);

  let presentCount = 0, absentCount = 0;
  for(let i = 0; i < 30; i++){
    const d = new Date(chinaTime.getTime() - i*24*60*60*1000);
    const ds = d.toISOString().slice(0,10);
    if(ds in log){
      if(log[ds]) presentCount++;
      else absentCount++;
    }
  }

  let daysHtml = '';
  for(let i = 29; i >= 0; i--){
    const d = new Date(chinaTime.getTime() - i*24*60*60*1000);
    const dateStr = d.toISOString().slice(0,10);
    const weekdays = ['日','一','二','三','四','五','六'];
    const hasRecord = dateStr in log;
    const isPresent = log[dateStr];
    const cls = hasRecord ? (isPresent ? 'present' : 'absent') : 'no-record';
    daysHtml += '<div class="cal-day '+cls+'">';
    daysHtml += '<div class="cal-date">'+(d.getMonth()+1)+'/'+d.getDate()+'</div>';
    daysHtml += '<div class="cal-week">周'+weekdays[d.getDay()]+'</div>';
    daysHtml += '<div class="cal-status">'+(hasRecord ? (isPresent ? '✓' : '✗') : '—')+'</div>';
    daysHtml += '</div>';
  }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML =
    '<div class="modal-box">'+
    '<div class="modal-header">'+
    '<div class="modal-title"><i class="fas fa-calendar-alt"></i> '+esc(name)+' · 最近 30 天</div>'+
    '<button class="modal-close">&times;</button>'+
    '</div>'+
    '<div class="modal-body">'+
    '<div class="cal-summary">'+
    '<div><span class="num">'+(presentCount+absentCount)+'</span>天有记录</div>'+
    '<div><span class="num" style="color:#2b6e2b;">'+presentCount+'</span>出勤</div>'+
    '<div><span class="num" style="color:#a12b35;">'+absentCount+'</span>休息</div>'+
    '</div>'+
    '<div class="cal-legend">'+
    '<span class="leg present">✓ 出勤</span>'+
    '<span class="leg absent">✗ 休息</span>'+
    '<span class="leg no-record">— 无记录</span>'+
    '</div>'+
    '<div class="cal-grid">'+daysHtml+'</div>'+
    '</div>'+
    '</div>';
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelector('.modal-close').onclick = close;
  overlay.onclick = e => { if(e.target === overlay) close(); };
}

function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  toast('保存中...', 'saving');
  saveTimer = setTimeout(doSave, 800);
}

async function doSave(){
  const changes = [];
  pendingChanges.forEach(k => {
    const [key, idx] = k.split('_');
    const staff = DATA.staffData[key][+idx];
    if(staff.secret){
      changes.push({ secret: staff.secret, present: staff.present });
    }
  });
  pendingChanges.clear();

  try{
    for(const ch of changes){
      const res = await fetch(WORKER + '/update-attendance', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(ch)
      });
      const json = await res.json();
      if(!json.ok) throw new Error(json.error);
    }
    toast('已保存 ✓', 'saved');
  }catch(e){
    toast('保存失败：'+e.message, 'error');
  }
}

showToday();
load();
</script>
</body>
</html>
