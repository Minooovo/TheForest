<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Forest · 编辑后台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
body{background:#f0ece6;padding:16px;min-height:100vh;}
.wrap{max-width:960px;margin:0 auto;}

/* 登录界面 */
.login-box{max-width:400px;margin:80px auto;background:#fff;border-radius:24px;padding:36px 32px;box-shadow:0 20px 40px rgba(0,0,0,.08);}
.login-box h1{font-size:1.5rem;color:#2e2a24;margin-bottom:8px;text-align:center;}
.login-box p{color:#8a7663;font-size:.88rem;text-align:center;margin-bottom:24px;}
.login-box input{width:100%;padding:12px 16px;border:1px solid #e0d6cc;border-radius:12px;font-size:.95rem;background:#fcf9f6;margin-bottom:16px;font-family:inherit;}
.login-box input:focus{outline:none;border-color:#b8a48e;background:#fffbf7;}
.login-box button{width:100%;background:#3a332c;color:#fff;border:none;border-radius:12px;padding:12px;font-weight:600;font-size:.95rem;cursor:pointer;}
.login-box button:hover{background:#2b251f;}
.login-error{color:#b34141;font-size:.82rem;margin-top:12px;text-align:center;min-height:20px;}

/* 主界面 */
.topbar{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:20px;padding:16px 22px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-size:1.3rem;color:#2e2a24;display:flex;align-items:center;gap:10px;}
.topbar h1 i{color:#a8907a;}
.topbar-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.save-status{font-size:.82rem;padding:6px 12px;border-radius:30px;font-weight:600;background:#f0e9e0;color:#5e4b3a;}
.save-status.saving{background:#fff3cd;color:#8a6d3b;}
.save-status.saved{background:#dff0d8;color:#2b6e2b;}
.save-status.error{background:#f8d7da;color:#a12b35;}
.btn{background:#fff;border:2px solid #d6cdc0;border-radius:30px;padding:9px 18px;font-weight:600;font-size:.88rem;color:#3a332c;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;}
.btn:hover{background:#f4ede6;border-color:#b8a48e;}
.btn-primary{background:#3a332c;border-color:#3a332c;color:#fff;}
.btn-primary:hover{background:#2b251f;border-color:#2b251f;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-danger{background:#fce9e9;border-color:#e6c1c1;color:#b34141;}
.btn-danger:hover{background:#f8d7d7;border-color:#cf9e9e;}
.btn-sm{padding:6px 12px;font-size:.78rem;}

.section{background:#fff;border-radius:20px;padding:20px 22px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:20px;}
.section h2{font-size:1.1rem;color:#2e2a24;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.section h2 i{color:#a8907a;}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:.82rem;font-weight:700;color:#6d5c4a;}
.field input[type=text],.field textarea,.field select{width:100%;padding:10px 14px;border:1px solid #e0d6cc;border-radius:10px;font-size:.9rem;background:#fcf9f6;color:#2e2a24;font-family:inherit;}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:#b8a48e;background:#fffbf7;}
.field textarea{resize:vertical;min-height:60px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){.field-row{grid-template-columns:1fr;}}

.toggle-row{display:flex;align-items:center;gap:10px;font-size:.9rem;color:#4e443b;font-weight:600;}
.toggle-row input[type=checkbox]{width:20px;height:20px;accent-color:#7c6b5c;cursor:pointer;}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.tab{background:#f1ebe4;border:2px solid transparent;border-radius:30px;padding:8px 18px;font-weight:600;font-size:.85rem;color:#423a32;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.tab.active{background:#e6d9cd;border-color:#b8a48e;}
.tab:hover{background:#e6d9cd;}

.staff-editor{background:#fcf9f6;border:1px solid #f0e7df;border-radius:16px;padding:16px;margin-bottom:14px;display:grid;grid-template-columns:160px 1fr;gap:16px;}
@media(max-width:600px){.staff-editor{grid-template-columns:1fr;}}
.photo-edit{width:160px;height:160px;background:#e9e1d7;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;position:relative;border:1px solid #d9cbb9;}
.photo-edit img{width:100%;height:100%;object-fit:cover;}
.photo-edit .photo-placeholder{font-size:3rem;color:#b8a48e;}
.photo-edit:hover::after{content:"📷 点击上传";position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;font-size:.85rem;display:flex;align-items:center;justify-content:center;font-weight:600;}
.photo-edit.uploading::after{content:"⏳ 上传中...";position:absolute;inset:0;background:rgba(0,0,0,.65);color:#fff;}
.staff-fields{display:flex;flex-direction:column;gap:10px;min-width:0;}
.staff-fields .field{margin-bottom:0;}
.staff-fields .field-row{margin-bottom:0;}
.staff-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;}

.res-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.res-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border:1px solid #f0e7df;border-radius:10px;font-size:.82rem;}
.res-item .res-type{font-weight:700;color:#a8907a;text-transform:uppercase;font-size:.7rem;}
.res-item .res-content{flex:1;min-width:0;color:#4e443b;word-break:break-all;}
.res-item .res-content img{max-width:60px;max-height:60px;border-radius:6px;display:block;}
.res-del{background:#fce9e9;border:1px solid #e6c1c1;color:#b34141;font-size:.72rem;padding:4px 10px;border-radius:6px;cursor:pointer;flex-shrink:0;}
.res-del:hover{background:#f8d7d7;}
.add-res-bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.add-res-bar button{background:#f6f0e8;border:1px dashed #c0a68b;color:#6d5a45;font-size:.78rem;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
.add-res-bar button:hover{background:#efe6d9;}

.loading{text-align:center;padding:60px;color:#a8907a;font-size:1rem;}
.error-box{background:#f8d7da;color:#a12b35;padding:16px;border-radius:12px;margin-bottom:20px;font-size:.9rem;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#3a332c;color:#fff;padding:12px 24px;border-radius:30px;font-size:.88rem;font-weight:600;z-index:9999;box-shadow:0 8px 20px rgba(0,0,0,.2);opacity:0;transition:.2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-8px);}
.toast.error{background:#b34141;}
.toast.success{background:#2b6e2b;}

.hidden{display:none !important;}
</style>
</head>
<body>

<!-- 登录界面 -->
<div class="login-box" id="loginBox">
  <h1><i class="fas fa-lock"></i> The Forest 后台</h1>
  <p>请输入编辑密码</p>
  <input type="password" id="pwdInput" placeholder="编辑密码" autocomplete="off">
  <button id="loginBtn">进入后台</button>
  <div class="login-error" id="loginError"></div>
</div>

<!-- 主界面 -->
<div class="wrap hidden" id="mainApp">
  <div class="topbar">
    <h1><i class="fas fa-sliders-h"></i> The Forest · 编辑后台</h1>
    <div class="topbar-actions">
      <span class="save-status" id="saveStatus">就绪</span>
      <button class="btn" id="reloadBtn"><i class="fas fa-sync-alt"></i> 重新加载</button>
      <button class="btn btn-primary" id="saveBtn"><i class="fas fa-save"></i> 保存到服务器</button>
      <button class="btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> 退出</button>
    </div>
  </div>

  <div id="content">
    <div class="loading"><i class="fas fa-spinner fa-spin"></i> 正在加载数据...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================
// 配置区
// ============================================
const EDIT_PASSWORD = 'forest2026';   // ⚠️ 编辑密码，改这里
const BIN_ID = '6abce361ffd5d160533e9bc5';
const WRITE_KEY = '$2a$10$G/MrwS5ED24eLLdMvv7e6.w7B9.7wu2mGacBzF6oIStxQSpGjNETO';  // ⚠️ 只有通过密码验证才会用到

const CLOUD_NAME = 'h6vw5ogh';
const UPLOAD_PRESET = 'forest_photos';
// ============================================

const API = 'https://api.jsonbin.io/v3/b/' + BIN_ID;

const CATEGORY_MAP = {
  '轻无树洞': '轻无树洞',
  '游戏主持': '游戏主持',
  '歌手': '歌手',
  '画手': '画手',
  'STAFF': '前台&店长'
};

const RESOURCE_CFG = {
  "歌手": {btn:'歌单',icon:'fa-music'},
  "画手": {btn:'例图',icon:'fa-image'},
  "游戏主持": {btn:'游戏单',icon:'fa-dice'}
};

let DATA = null;
let currentTab = '轻无树洞';
let unlocked = false;

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);

function setStatus(text, cls){
  const el = $('saveStatus');
  el.textContent = text;
  el.className = 'save-status' + (cls ? ' '+cls : '');
}

function toast(text, type){
  const el = $('toast');
  el.textContent = text;
  el.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(()=>{ el.className = 'toast'; }, 2500);
}

// ============ 登录 ============
function tryLogin(){
  const pwd = $('pwdInput').value;
  if(pwd === EDIT_PASSWORD){
    unlocked = true;
    sessionStorage.setItem('tf_unlocked', '1');
    showMain();
  }else{
    $('loginError').textContent = '密码错误';
  }
}

function showMain(){
  $('loginBox').classList.add('hidden');
  $('mainApp').classList.remove('hidden');
  load();
}

function logout(){
  unlocked = false;
  sessionStorage.removeItem('tf_unlocked');
  location.reload();
}

// 自动登录（同一标签页内有效）
if(sessionStorage.getItem('tf_unlocked') === '1'){
  unlocked = true;
  showMain();
}

$('loginBtn').onclick = tryLogin;
$('pwdInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
$('logoutBtn').onclick = logout;

// ============ Cloudinary 上传 ============
async function uploadToCloudinary(file){
  const url = 'https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload';
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', UPLOAD_PRESET);
  const res = await fetch(url, { method:'POST', body: fd });
  if(!res.ok) throw new Error('上传失败：'+res.status);
  const json = await res.json();
  return json.secure_url || json.url;
}

// ============ 加载数据 ============
async function load(){
  setStatus('加载中...','saving');
  try{
    const res = await fetch(API + '/latest', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    DATA = json.record;
    DATA.staffData = DATA.staffData || {};
    Object.keys(CATEGORY_MAP).forEach(c => { DATA.staffData[c] = DATA.staffData[c] || []; });
    render();
    setStatus('已加载','saved');
    setTimeout(()=>setStatus('就绪'), 1500);
  }catch(e){
    $('content').innerHTML = '<div class="error-box"><i class="fas fa-exclamation-triangle"></i> 加载失败：'+esc(e.message)+'</div>';
    setStatus('加载失败','error');
  }
}

// ============ 保存 ============
async function save(){
  if(!unlocked){ toast('请先登录','error'); return; }
  setStatus('保存中...','saving');
  try{
    const res = await fetch(API, {
      method:'PUT',
      headers:{
        'Content-Type':'application/json',
        'X-Master-Key': WRITE_KEY
      },
      body: JSON.stringify(DATA)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    setStatus('已保存 ✓','saved');
    toast('保存成功','success');
    setTimeout(()=>setStatus('就绪'), 2000);
  }catch(e){
    setStatus('保存失败：'+e.message,'error');
    toast('保存失败：'+e.message,'error');
  }
}

// ============ 渲染 ============
function render(){
  let html = '';

  html += '<div class="section">';
  html += '<h2><i class="fas fa-store"></i> 店铺信息</h2>';
  html += '<div class="field"><label>店名</label><input type="text" id="f_shopName" value="'+esc(DATA.shopName||'')+'"></div>';
  html += '<div class="field-row">';
  html += '<div class="field"><label>营业状态</label><div class="toggle-row"><input type="checkbox" id="f_isOpen" '+(DATA.isOpen?'checked':'')+'> <span>'+(DATA.isOpen?'营业中':'已打烊')+'</span></div></div>';
  html += '<div class="field"><label>营业时间</label><input type="text" id="f_Openinghours" value="'+esc(DATA.Openinghours||'')+'"></div>';
  html += '</div>';
  html += '<div class="field"><label>客群信息</label><input type="text" id="f_audienceInfo" value="'+esc(DATA.audienceInfo||'')+'"></div>';
  html += '<div class="field"><label>招募信息</label><textarea id="f_recruitInfo">'+esc(DATA.recruitInfo||'')+'</textarea></div>';
  html += '</div>';

  html += '<div class="section">';
  html += '<h2><i class="fas fa-users"></i> 店员管理</h2>';
  html += '<div class="tabs" id="tabs">';
  Object.keys(CATEGORY_MAP).forEach(key=>{
    const display = CATEGORY_MAP[key];
    const count = (DATA.staffData[key]||[]).length;
    html += '<button class="tab '+(key===currentTab?'active':'')+'" data-cat="'+esc(key)+'"><i class="fas fa-folder"></i> '+esc(display)+' ('+count+')</button>';
  });
  html += '</div>';
  html += '<div id="staffArea"></div>';
  html += '</div>';

  $('content').innerHTML = html;

  $('f_shopName').oninput = e => DATA.shopName = e.target.value;
  $('f_isOpen').onchange = e => { DATA.isOpen = e.target.checked; render(); };
  $('f_Openinghours').oninput = e => DATA.Openinghours = e.target.value;
  $('f_audienceInfo').oninput = e => DATA.audienceInfo = e.target.value;
  $('f_recruitInfo').oninput = e => DATA.recruitInfo = e.target.value;

  $('tabs').onclick = e => {
    const t = e.target.closest('.tab');
    if(!t) return;
    currentTab = t.dataset.cat;
    render();
  };

  renderStaffArea();
}

function renderStaffArea(){
  const arr = DATA.staffData[currentTab] || [];
  const cfg = RESOURCE_CFG[currentTab];
  let html = '';

  if(arr.length === 0){
    html += '<div style="text-align:center;padding:24px;color:#b8a48e;font-size:.9rem;">该分类下暂无店员</div>';
  }

  arr.forEach((staff, idx)=>{
    html += '<div class="staff-editor" data-idx="'+idx+'">';
    const photoHtml = staff.photo
      ? '<img src="'+esc(staff.photo)+'" alt="">'
      : '<div class="photo-placeholder"><i class="fas fa-user-circle"></i></div>';
    html += '<div>';
    html += '<div class="photo-edit" data-photo-idx="'+idx+'">'+photoHtml+'</div>';
    html += '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">';
    html += '<button class="btn btn-sm" data-photo-url="'+idx+'"><i class="fas fa-link"></i> URL</button>';
    html += '<button class="btn btn-sm btn-danger" data-photo-clear="'+idx+'"><i class="fas fa-times"></i> 清除</button>';
    html += '</div>';
    html += '</div>';
    html += '<div class="staff-fields">';
    html += '<div class="field-row">';
    html += '<div class="field"><label>姓名</label><input type="text" data-field="name" data-idx="'+idx+'" value="'+esc(staff.name||'')+'"></div>';
    html += '<div class="field"><label>职位</label><input type="text" data-field="role" data-idx="'+idx+'" value="'+esc(staff.role||'')+'"></div>';
    html += '</div>';
    html += '<div class="field"><label>详情</label><input type="text" data-field="details" data-idx="'+idx+'" value="'+esc(staff.details||'')+'"></div>';
    html += '<div class="staff-actions">';
    html += '<label class="toggle-row"><input type="checkbox" data-field="present" data-idx="'+idx+'" '+(staff.present?'checked':'')+'> 今日出勤</label>';
    html += '<button class="btn btn-sm btn-danger" data-del="'+idx+'"><i class="fas fa-trash"></i> 删除</button>';
    html += '</div>';

    if(cfg){
      html += '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #e6dbc9;">';
      html += '<label style="font-size:.78rem;font-weight:700;color:#6d5c4a;">'+esc(cfg.btn)+'</label>';
      html += '<div class="res-list">';
      (staff.resources||[]).forEach((r, ri)=>{
        html += '<div class="res-item">';
        html += '<span class="res-type">'+(r.type==='image'?'图片':'链接')+'</span>';
        html += '<div class="res-content">';
        if(r.type==='image'){
          if(r.data) html += '<img src="'+esc(r.data)+'" alt="">';
          html += '<span>'+esc(r.label||'未命名')+'</span>';
        }else{
          html += '<span>'+esc(r.label||'')+' · '+esc(r.url||'')+'</span>';
        }
        html += '</div>';
        html += '<button class="res-del" data-del-res="'+idx+'_'+ri+'">删除</button>';
        html += '</div>';
      });
      html += '</div>';
      html += '<div class="add-res-bar">';
      html += '<button data-add-img="'+idx+'"><i class="fas fa-image"></i> 上传图片</button>';
      html += '<button data-add-link="'+idx+'"><i class="fas fa-link"></i> 加链接</button>';
      html += '</div>';
      html += '</div>';
    }

    html += '</div></div>';
  });

  html += '<button class="btn btn-primary" id="addStaffBtn" style="margin-top:8px;"><i class="fas fa-plus-circle"></i> 增加店员</button>';

  $('staffArea').innerHTML = html;

  $('staffArea').querySelectorAll('[data-field]').forEach(el=>{
    const field = el.dataset.field;
    const idx = +el.dataset.idx;
    el.addEventListener('input', ()=>{
      if(field==='present') DATA.staffData[currentTab][idx].present = el.checked;
      else DATA.staffData[currentTab][idx][field] = el.value;
    });
  });

  $('staffArea').querySelectorAll('[data-photo-idx]').forEach(el=>{
    el.onclick = async ()=>{
      const idx = +el.dataset.photoIdx;
      const inp = document.createElement('input');
      inp.type='file';inp.accept='image/*';
      inp.onchange = async e=>{
        const f = e.target.files[0];if(!f)return;
        el.classList.add('uploading');
        try{
          const url = await uploadToCloudinary(f);
          DATA.staffData[currentTab][idx].photo = url;
          toast('照片上传成功','success');
          renderStaffArea();
        }catch(err){
          toast('上传失败：'+err.message,'error');
        }finally{
          el.classList.remove('uploading');
        }
      };
      inp.click();
    };
  });

  $('staffArea').querySelectorAll('[data-photo-url]').forEach(el=>{
    el.onclick = ()=>{
      const idx = +el.dataset.photoUrl;
      const url = prompt('粘贴图片 URL：', DATA.staffData[currentTab][idx].photo || 'https://');
      if(!url) return;
      DATA.staffData[currentTab][idx].photo = url;
      renderStaffArea();
    };
  });

  $('staffArea').querySelectorAll('[data-photo-clear]').forEach(el=>{
    el.onclick = ()=>{
      const idx = +el.dataset.photoClear;
      if(!confirm('清除这张照片？')) return;
      DATA.staffData[currentTab][idx].photo = null;
      renderStaffArea();
    };
  });

  $('staffArea').querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=>{
      const idx = +el.dataset.del;
      const name = DATA.staffData[currentTab][idx].name || '该店员';
      if(!confirm('确定删除「'+name+'」？')) return;
      DATA.staffData[currentTab].splice(idx,1);
      render();
    };
  });

  $('staffArea').querySelectorAll('[data-del-res]').forEach(el=>{
    el.onclick = ()=>{
      const [si, ri] = el.dataset.delRes.split('_').map(Number);
      DATA.staffData[currentTab][si].resources.splice(ri,1);
      renderStaffArea();
    };
  });

  $('staffArea').querySelectorAll('[data-add-img]').forEach(el=>{
    el.onclick = ()=>{
      const idx = +el.dataset.addImg;
      const inp = document.createElement('input');
      inp.type='file';inp.accept='image/*';
      inp.onchange = async e=>{
        const f = e.target.files[0];if(!f)return;
        const label = prompt('给这张图片起个名字：','图片');
        if(label===null)return;
        try{
          toast('上传中...');
          const url = await uploadToCloudinary(f);
          const staff = DATA.staffData[currentTab][idx];
          staff.resources = staff.resources || [];
          staff.resources.push({type:'image', data:url, label:label||'未命名'});
          toast('上传成功','success');
          renderStaffArea();
        }catch(err){
          toast('上传失败：'+err.message,'error');
        }
      };
      inp.click();
    };
  });

  $('staffArea').querySelectorAll('[data-add-link]').forEach(el=>{
    el.onclick = ()=>{
      const idx = +el.dataset.addLink;
      const url = prompt('输入链接（https:// 开头）：','https://');
      if(!url) return;
      const label = prompt('给这个链接起个名字：','链接');
      if(label===null) return;
      const staff = DATA.staffData[currentTab][idx];
      staff.resources = staff.resources || [];
      staff.resources.push({type:'link', url:url, label:label||url});
      renderStaffArea();
    };
  });

  const addBtn = $('addStaffBtn');
  if(addBtn){
    addBtn.onclick = ()=>{
      DATA.staffData[currentTab].push({
        id: uid('staff'),
        name: '新店员',
        role: '职位',
        details: '描述信息',
        present: false,
        photo: null,
        resources: []
      });
      render();
    };
  }
}

$('saveBtn').onclick = save;
$('reloadBtn').onclick = ()=>{ if(confirm('重新加载会丢弃未保存的修改？')) load(); };
</script>
</body>
</html>
